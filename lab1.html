<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ทดลอง JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .section {
            margin: 20px 0;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        input[type="text"] {
            padding: 8px;
            width: 300px;
            font-size: 14px;
            margin-right: 10px;
        }
        #output {
            margin-top: 10px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 3px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h1>ทดลอง JavaScript</h1>

    <!-- Section ปุ่ม -->
    <div class="section">
        <h2>ปุ่มทั้ง 3 ประเภท</h2>
        
        <!-- Inline JavaScript -->
        <button onclick="alert('ชื่อนักศึกษา: ธีธัช คัคคนัมพร')">ปุ่มที่ 1 (Inline)</button>

        <!-- Internal JavaScript -->
        <button id="btn2">ปุ่มที่ 2 (Internal)</button>

        <!-- External JavaScript -->
        <button id="btn3">ปุ่มที่ 3 (External)</button>
    </div>

    <!-- Section กล่องข้อความและแสดงผล -->
    <div class="section">
        <h2>กล่องข้อความและแสดงผล</h2>
        <input type="text" id="textInput" placeholder="กรอกข้อความที่นี่...">
        <button onclick="displayText()">แสดงข้อความ</button>
        <div id="output"></div>
    </div>

    <!-- Internal JavaScript -->
    <script>
        document.getElementById('btn2').onclick = function() {
            alert('วันที่ปัจจุบัน: 24/2/2569');
        };
        
        function displayText() {
            const textValue = document.getElementById('textInput').value;
            const outputDiv = document.getElementById('output');
            
            if (textValue.trim() === '') {
                outputDiv.textContent = 'กรุณากรอกข้อความ';
            } else {
                outputDiv.textContent = 'คุณกรอก: ' + textValue;
            }
        }
    </script>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
