<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แสดงข้อมูลนักศึกษา</title>
<style>
    body{
        font-family: Arial;
        text-align:center;
        margin-top:40px;
    }
    button{
        padding:10px 18px;
        font-size:16px;
        cursor:pointer;
    }
    #output{
        margin-top:20px;
        font-size:18px;
        color:darkblue;
    }
</style>
</head>
<body>

<h2>ข้อมูลนักศึกษา</h2>

<button onclick="showData()">แสดงข้อมูล</button>

<div id="output"></div>

<script>
// -----------------------------
// 1) ตัวแปรข้อมูลนักศึกษา
// -----------------------------

const studentID = "68030071";
const studentName = "ฐิติกาญจน์ รัตนะเอี่ยม";

let midtermScore = 45;
let finalScore = 50;


// -----------------------------
// 2) Object นักศึกษา
// -----------------------------

const student = {
    id: studentID,
    name: studentName,
    major: "เทคโนโลยีคอมพิวเตอร์",
    gpa: 3.75
};


// -----------------------------
// ฟังก์ชันแสดงผล
// -----------------------------
function showData(){

    let totalScore = midtermScore + finalScore;

    document.getElementById("output").innerHTML =
        "<b>รหัส:</b> " + student.id + "<br>" +
        "<b>ชื่อ:</b> " + student.name + "<br>" +
        "<b>สาขา:</b> " + student.major + "<br>" +
        "<b>GPA:</b> " + student.gpa + "<br><br>" +
        "<b>คะแนนกลางภาค:</b> " + midtermScore + "<br>" +
        "<b>คะแนนปลายภาค:</b> " + finalScore + "<br>" +
        "<b>คะแนนรวม:</b> " + totalScore;
}
</script>

</body>
</html>
