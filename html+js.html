<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แบบฝึก JavaScript</title>
</head>
<body>

<h2>ผลลัพธ์โปรแกรม</h2>
<div id="output"></div>

<script>
let result = "";

// ===============================
// 1. ตรวจเลขคู่ / เลขคี่
// ===============================
let number = 8;
if (number % 2 === 0) {
    result += number + " เป็นเลขคู่<br>";
} else {
    result += number + " เป็นเลขคี่<br>";
}


// ===============================
// 2. สูตรคูณแม่ 8 (for)
// ===============================
result += "<br><b>สูตรคูณแม่ 8</b><br>";
for (let i = 1; i <= 12; i++) {
    result += "8 x " + i + " = " + (8 * i) + "<br>";
}


// ===============================
// 3. สูตรคูณแม่ 3 (while)
// ===============================
result += "<br><b>สูตรคูณแม่ 3</b><br>";
let i = 1;
while (i <= 12) {
    result += "3 x " + i + " = " + (3 * i) + "<br>";
    i++;
}


// ===============================
// 4. นับถอยหลัง 10 → 1
// ===============================
result += "<br><b>นับถอยหลัง</b><br>";
for (let i = 10; i >= 1; i--) {
    result += i + "<br>";
}


// ===============================
// 5. ตรวจช่วงวัย
// ===============================
let age = 16;
result += "<br><b>ช่วงวัย</b><br>";

if (age <= 12) {
    result += "วัยเด็ก";
} else if (age <= 18) {
    result += "วัยรุ่น";
} else {
    result += "วัยผู้ใหญ่";
}


// แสดงผล
document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
