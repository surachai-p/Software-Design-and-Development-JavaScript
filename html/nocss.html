<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ก่อนใส่ CSS</title>
</head>
<body>

<h1>แบบฟอร์มจองห้องพัก</h1>

<form>
    <p>ชื่อ-นามสกุล</p>
    <input type="text">

    <p>อีเมล</p>
    <input type="email">

    <p>เบอร์โทรศัพท์</p>
    <input type="tel">

    <p>วันที่เช็คอิน</p>
    <input type="date">

    <p>วันที่เช็คเอาท์</p>
    <input type="date">

    <p>ประเภทห้องพัก</p>
    <select>
        <option>ห้องมาตรฐาน</option>
        <option>ห้องดีลักซ์</option>
        <option>ห้องสวีท</option>
    </select>

    <p>จำนวนผู้เข้าพัก</p>
    <input type="number">

    <br><br>
    <button>จองห้องพัก</button>
</form>

</body>
</html>
