<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Lab Java 2.4.1</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; padding: 30px; line-height: 1.8; }
        input { padding: 5px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 5px 15px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 4px; transition: 0.2s; }
        button:hover { background-color: #2980b9; transform: scale(1.05); }
        .result-text { font-weight: bold; color: #27ae60; margin-top: 5px; min-height: 25px; }
        h2 { margin-top: 25px; border-left: 5px solid #3498db; padding-left: 10px; }
    </style>
</head>
<body>

    <h2>1. คำนวณค่า BMI</h2>
    น้ำหนัก (kg): <input type="number" id="wIn"> 
    ส่วนสูง (cm): <input type="number" id="hIn">
    <button onclick="runBMI()">คำนวณ</button>
    <p id="bmi" class="result-text"></p>

    <h2>2. กล่าวคำทักทายตามอายุ</h2>
    ชื่อ: <input type="text" id="nameIn"> 
    อายุ: <input type="number" id="ageIn">
    <button onclick="runGreet()">ทักทาย</button>
    <p id="greeting" class="result-text"></p>

    <h2>3. ตรวจสอบ Password</h2>
    ใส่รหัสผ่าน: <input type="password" id="passIn">
    <button onclick="runPass()">ตรวจสอบ</button>
    <p id="password" class="result-text"></p>

    <script src="lab java 2.4.1.js"></script>
</body>
</html>
